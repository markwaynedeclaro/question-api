spring.application.name=question-api
server.port=80

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.security.enabled=true
springdoc.api-docs.path=/api-docs




management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.info.enabled=true
management.info.env.enabled=true
info.app.name=Question API
info.app.version=1.0.0
info.app.description=A Trivia Question API that retrieves questions from https://opentdb.com/

api.version=v1
trivia.api.connectTimeout=30
trivia.api.readTimeout=30
trivia.api.writeTimeout=30
trivia.api.url=https://opentdb.com/api.php

parameter.default.amount=10

